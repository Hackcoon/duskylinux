<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Dusky Template Generator</title>
<style>
  :root { color-scheme: dark; }
  * { box-sizing: border-box; }
  body {
    width: 460px; margin: 0; padding: 12px;
    background: #191614; color: #f5ebe0;
    font: 13px/1.45 system-ui, sans-serif;
  }
  header { display: flex; align-items: baseline; gap: 8px; margin-bottom: 8px; }
  h1 { flex: 1; margin: 0; font-size: 13px; color: #e6c280; }
  #domain { font: 12px ui-monospace, monospace; color: #d4a359; }
  #path { margin: 0 0 8px; font: 10.5px ui-monospace, monospace; color: #8f857a;
          overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  textarea {
    width: 100%; height: 300px; resize: vertical;
    font: 11.5px/1.5 ui-monospace, monospace; color: #f5ebe0;
    background: #0f0d0c; border: 1px solid #3d342c; border-radius: 8px; padding: 8px;
    tab-size: 4;
  }
  textarea:focus-visible { outline: 2px solid #e6c280; outline-offset: 1px; }
  .grid { display: grid; grid-template-columns: 1fr 1fr; gap: 6px; margin-top: 8px; }
  button {
    display: flex; flex-direction: column; gap: 1px; align-items: flex-start;
    font: inherit; color: #f5ebe0; background: #2d2722;
    border: 1px solid #3d342c; border-radius: 8px; padding: 7px 10px;
    cursor: pointer; text-align: left;
  }
  button:hover:not(:disabled) { border-color: #d4a359; }
  button:disabled { opacity: .4; cursor: default; }
  button:focus-visible { outline: 2px solid #e6c280; outline-offset: 1px; }
  button b { font-weight: 700; }
  button small { color: #8f857a; font-size: 10.5px; }
  .attention { border-color: #e6c280; }
  .on { background: #e6c280; color: #191614; border-color: #e6c280; }
  .on small { color: #4a3a1e; }
  .wide { grid-column: 1 / -1; }
  .status { min-height: 1.3em; margin: 8px 0 0; font-size: 11.5px; color: #c4b8aa; }
  .status.ok { color: #81c784; } .status.err { color: #e57373; }
  .status.warn { color: #e6c280; } .status.busy { color: #d4a359; }
</style>
</head>
<body>
  <header>
    <h1>Dusky Template Generator</h1>
    <span id="domain">…</span>
  </header>
  <p id="path"></p>
  <textarea id="css" spellcheck="false" aria-label="Template CSS"></textarea>
  <div class="grid">
    <button id="auto"><b>⚡ Auto-map</b><small>scan this site's colour tokens</small></button>
    <button id="pick"><b>🎯 Pick elements</b><small>click things on the page, assign a role</small></button>
    <button id="save" class="wide"><b>💾 Saved</b></button>
    <button id="copy"><b>📋 Copy</b></button>
    <button id="delete"><b>🗑 Delete</b></button>
  </div>
  <p class="status" id="status" role="status" aria-live="polite"></p>
  <script src="popup.js"></script>
</body>
</html>
